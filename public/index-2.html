<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Милкграм</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<meta name="theme-color" content="#17212b" />
<script src="/socket.io/socket.io.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Roboto, -apple-system, sans-serif; height: 100vh; overflow: hidden; background: #0e1621; }

  /* ---- Экран входа (тёмный, как Telegram) ---- */
  #auth-screen {
    height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0e1621;
  }
  .auth-card {
    background: #17212b; border-radius: 16px; padding: 32px; width: 340px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .auth-card h1 { color: #2AABEE; font-size: 26px; margin-bottom: 4px; }
  .auth-card p.sub { color: #7d8b99; font-size: 13px; margin-bottom: 20px; }
  .auth-card input {
    width: 100%; padding: 11px 14px; margin-bottom: 10px; border: 1px solid #2b3947;
    border-radius: 10px; font-size: 14px; outline: none; background: #242f3d; color: #fff;
  }
  .auth-card input::placeholder { color: #6b7a8a; }
  .auth-card input:focus { border-color: #2AABEE; }
  .auth-card button {
    width: 100%; padding: 11px; background: #2AABEE; color: white; border: none;
    border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px;
  }
  .auth-card button:hover { background: #229ED9; }
  .auth-toggle { text-align: center; margin-top: 14px; font-size: 13px; color: #7d8b99; cursor: pointer; }
  .auth-toggle span { color: #2AABEE; font-weight: 600; }
  .auth-error { color: #f04747; font-size: 12.5px; margin-bottom: 8px; min-height: 16px; }

  /* ---- Основной экран ---- */
  #app { display: none; height: 100vh; }
  #app.active { display: flex; }

  .sidebar { width: 340px; border-right: 1px solid #0e1621; display: flex; flex-direction: column; flex-shrink: 0; background: #17212b; }
  .sidebar-header {
    display: flex; align-items: center; justify-content: space-between; padding: 14px 16px;
    border-bottom: 1px solid #0e1621;
  }
  .sidebar-header .brand { font-weight: 700; color: #2AABEE; font-size: 18px; }
  .logout-btn { font-size: 12px; color: #7d8b99; cursor: pointer; border: none; background: none; }
  .search-box {
    margin: 10px 16px; padding: 8px 12px; background: #242f3d; border-radius: 20px;
  }
  .search-box input { border: none; background: none; outline: none; width: 100%; font-size: 13.5px; color: #fff; }
  .search-box input::placeholder { color: #6b7a8a; }

  .user-list { flex: 1; overflow-y: auto; }
  .user-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border: none;
    background: none; width: 100%; text-align: left; border-bottom: none;
  }
  .user-item:hover { background: #1c2733; }
  .user-item.active { background: #2b5278; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 600; font-size: 16px; flex-shrink: 0; position: relative;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #4dd964; border: 2px solid #17212b; position: absolute; bottom: -1px; right: -1px; }
  .u-name { font-size: 14.5px; font-weight: 500; color: #fff; }
  .u-status { font-size: 12px; color: #7d8b99; }
  .user-item.active .u-status { color: #cfe6f7; }

  .chat-area { flex: 1; display: flex; flex-direction: column; background: #0e1621; background-image: radial-gradient(circle at 20% 20%, #16222e 0%, #0e1621 60%); }
  .chat-header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: #17212b; border-bottom: 1px solid #0e1621; }
  .chat-header .u-name { font-size: 15px; color: #fff; }
  .messages { flex: 1; overflow-y: auto; padding: 20px 40px; display: flex; flex-direction: column; gap: 6px; }
  .msg-row { display: flex; }
  .msg-row.me { justify-content: flex-end; }
  .bubble { max-width: 60%; padding: 9px 14px; border-radius: 16px; font-size: 14.5px; line-height: 1.35; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
  .bubble.them { background: #182533; color: #fff; border-bottom-left-radius: 4px; }
  .bubble.me { background: #2b5278; color: #fff; border-bottom-right-radius: 4px; }
  .bubble .time { font-size: 10.5px; color: #a3b6c6; text-align: right; margin-top: 3px; }

  .composer { display: flex; align-items: center; gap: 10px; padding: 12px 20px; background: #17212b; border-top: 1px solid #0e1621; }
  .composer input {
    flex: 1; padding: 10px 16px; border-radius: 22px; border: none; background: #242f3d; outline: none; font-size: 14px; color: #fff;
  }
  .composer input::placeholder { color: #6b7a8a; }
  .composer button {
    width: 40px; height: 40px; border-radius: 50%; background: #2AABEE; border: none; color: white;
    cursor: pointer; font-size: 16px; flex-shrink: 0;
  }
  .composer button:hover { background: #229ED9; }

  .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: #6b7a8a; font-size: 14px; }

  .icon-btn { width: 38px; height: 38px; border-radius: 50%; border: none; background: none; color: #2AABEE; font-size: 18px; cursor: pointer; }
  .icon-btn:hover { background: #1c2733; }

  /* ---- Экран звонка ---- */
  #call-screen {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: linear-gradient(160deg, #1c2733 0%, #0e1621 100%);
    flex-direction: column; align-items: center; justify-content: center; color: #fff;
  }
  #call-screen.active { display: flex; }
  .call-avatar {
    width: 110px; height: 110px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 600; color: white; margin-bottom: 18px;
  }
  .call-name { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .call-status { font-size: 14px; color: #9db2c4; margin-bottom: 50px; }
  .call-controls { display: flex; gap: 30px; align-items: center; }
  .call-btn {
    width: 62px; height: 62px; border-radius: 50%; border: none; font-size: 24px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .call-btn.reject { background: #f04747; color: white; }
  .call-btn.accept { background: #4dd964; color: white; }
  .call-btn.mute { background: #2b3947; color: white; }
  .call-btn.mute.on { background: #2AABEE; }
  .call-btn.end { background: #f04747; color: white; }
  audio#remote-audio { display: none; }
</style>
</head>
<body>

<!-- Экран авторизации -->
<div id="auth-screen">
  <div class="auth-card">
    <h1>Милкграм 🥛</h1>
    <p class="sub" id="auth-sub">Войдите в аккаунт</p>
    <div class="auth-error" id="auth-error"></div>
    <input id="auth-username" placeholder="Логин" autocomplete="username" />
    <input id="auth-password" type="password" placeholder="Пароль" autocomplete="current-password" />
    <button id="auth-submit">Войти</button>
    <div class="auth-toggle" id="auth-toggle">Нет аккаунта? <span>Зарегистрироваться</span></div>
  </div>
</div>

<!-- Основное приложение -->
<div id="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="brand">Милкграм</span>
      <button class="logout-btn" id="logout-btn">Выйти</button>
    </div>
    <div class="search-box"><input id="search-input" placeholder="Поиск людей..." /></div>
    <div class="user-list" id="user-list"></div>
  </div>
  <div class="chat-area">
    <div id="empty-state" class="empty-state">Выберите собеседника слева</div>
    <div id="chat-content" style="display:none; flex:1; flex-direction:column;">
      <div class="chat-header">
        <div class="avatar" id="chat-avatar"></div>
        <div style="flex:1">
          <div class="u-name" id="chat-name"></div>
          <div class="u-status" id="chat-status">не в сети</div>
        </div>
        <button class="icon-btn" id="call-audio-btn" title="Позвонить">📞</button>
      </div>
      <div class="messages" id="messages"></div>
      <div class="composer">
        <input id="msg-input" placeholder="Написать сообщение..." />
        <button id="send-btn">➤</button>
      </div>
    </div>
  </div>
</div>

<!-- Экран звонка -->
<div id="call-screen">
  <div class="call-avatar" id="call-avatar"></div>
  <div class="call-name" id="call-name"></div>
  <div class="call-status" id="call-status">вызов...</div>
  <div class="call-controls" id="call-controls-incoming" style="display:none;">
    <button class="call-btn reject" id="call-reject-btn">✕</button>
    <button class="call-btn accept" id="call-accept-btn">📞</button>
  </div>
  <div class="call-controls" id="call-controls-active" style="display:none;">
    <button class="call-btn mute" id="call-mute-btn">🎙️</button>
    <button class="call-btn end" id="call-end-btn">✕</button>
  </div>
  <audio id="remote-audio" autoplay></audio>
</div>

<script>
const API = ""; // тот же origin, что и сервер
let mode = "login"; // login | register
let token = localStorage.getItem("milkgram_token");
let me = JSON.parse(localStorage.getItem("milkgram_user") || "null");
let socket = null;
let users = [];
let onlineIds = new Set();
let activeUser = null;

const colors = ["#FF6B6B", "#4D96FF", "#6BCB77", "#845EF7", "#F59F00", "#20C997", "#F06595"];
function colorFor(id) { return colors[id % colors.length]; }
function initials(name) { return name.slice(0, 2).toUpperCase(); }

// ---------- Авторизация ----------
const authSub = document.getElementById("auth-sub");
const authToggle = document.getElementById("auth-toggle");
const authSubmit = document.getElementById("auth-submit");
const authError = document.getElementById("auth-error");

authToggle.onclick = () => {
  mode = mode === "login" ? "register" : "login";
  authSub.textContent = mode === "login" ? "Войдите в аккаунт" : "Создайте новый аккаунт";
  authSubmit.textContent = mode === "login" ? "Войти" : "Зарегистрироваться";
  authToggle.innerHTML = mode === "login"
    ? 'Нет аккаунта? <span>Зарегистрироваться</span>'
    : 'Уже есть аккаунт? <span>Войти</span>';
  authError.textContent = "";
};

authSubmit.onclick = async () => {
  const username = document.getElementById("auth-username").value.trim();
  const password = document.getElementById("auth-password").value;
  authError.textContent = "";
  try {
    const res = await fetch(`${API}/api/${mode}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok) { authError.textContent = data.error || "Ошибка"; return; }
    token = data.token;
    me = data.user;
    localStorage.setItem("milkgram_token", token);
    localStorage.setItem("milkgram_user", JSON.stringify(me));
    startApp();
  } catch (e) {
    authError.textContent = "Не удалось связаться с сервером";
  }
};

document.getElementById("logout-btn").onclick = () => {
  localStorage.removeItem("milkgram_token");
  localStorage.removeItem("milkgram_user");
  location.reload();
};

// ---------- Приложение ----------
async function startApp() {
  document.getElementById("auth-screen").style.display = "none";
  document.getElementById("app").classList.add("active");

  socket = io({ auth: { token } });
  attachCallSocketHandlers();
  socket.on("presence", ({ userId, online }) => {
    if (online) onlineIds.add(userId); else onlineIds.delete(userId);
    renderUsers();
    if (activeUser && activeUser.id === userId) {
      document.getElementById("chat-status").textContent = online ? "в сети" : "не в сети";
    }
  });
  socket.on("new_message", (m) => {
    if (activeUser && (m.from_id === activeUser.id || m.to_id === activeUser.id)) {
      appendMessage(m);
    }
  });

  await loadUsers();
}

async function loadUsers() {
  const res = await fetch(`${API}/api/users`, { headers: { Authorization: `Bearer ${token}` } });
  users = await res.json();
  renderUsers();
}

function renderUsers() {
  const list = document.getElementById("user-list");
  const q = document.getElementById("search-input").value.toLowerCase();
  list.innerHTML = "";
  users.filter(u => u.username.toLowerCase().includes(q)).forEach(u => {
    const btn = document.createElement("button");
    btn.className = "user-item" + (activeUser && activeUser.id === u.id ? " active" : "");
    btn.innerHTML = `
      <div class="avatar" style="background:${colorFor(u.id)}">${initials(u.username)}
        ${onlineIds.has(u.id) ? '<span class="dot"></span>' : ''}
      </div>
      <div>
        <div class="u-name">${u.username}</div>
        <div class="u-status">${onlineIds.has(u.id) ? "в сети" : "не в сети"}</div>
      </div>`;
    btn.onclick = () => openChat(u);
    list.appendChild(btn);
  });
}
document.getElementById("search-input").oninput = renderUsers;

async function openChat(u) {
  activeUser = u;
  document.getElementById("empty-state").style.display = "none";
  document.getElementById("chat-content").style.display = "flex";
  document.getElementById("chat-avatar").style.background = colorFor(u.id);
  document.getElementById("chat-avatar").textContent = initials(u.username);
  document.getElementById("chat-name").textContent = u.username;
  document.getElementById("chat-status").textContent = onlineIds.has(u.id) ? "в сети" : "не в сети";
  renderUsers();

  const res = await fetch(`${API}/api/messages/${u.id}`, { headers: { Authorization: `Bearer ${token}` } });
  const msgs = await res.json();
  const box = document.getElementById("messages");
  box.innerHTML = "";
  msgs.forEach(appendMessage);
}

function appendMessage(m) {
  const box = document.getElementById("messages");
  const mine = m.from_id === me.id;
  const row = document.createElement("div");
  row.className = "msg-row " + (mine ? "me" : "them");
  const time = new Date(m.created_at).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  row.innerHTML = `<div class="bubble ${mine ? "me" : "them"}">${escapeHtml(m.text)}<div class="time">${time}</div></div>`;
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

document.getElementById("send-btn").onclick = sendMsg;
document.getElementById("msg-input").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMsg(); });

function sendMsg() {
  const input = document.getElementById("msg-input");
  const text = input.value.trim();
  if (!text || !activeUser) return;
  socket.emit("private_message", { to: activeUser.id, text });
  input.value = "";
}

// Автовход, если токен уже есть
if (token && me) startApp();

// ---------- Звонки (WebRTC) ----------
const STUN_SERVERS = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
let pc = null;              // RTCPeerConnection
let localStream = null;     // микрофон
let callPeer = null;        // с кем сейчас звонок { id, username }
let isMuted = false;
let pendingCandidates = [];

const callScreen = document.getElementById("call-screen");
const callAvatar = document.getElementById("call-avatar");
const callName = document.getElementById("call-name");
const callStatus = document.getElementById("call-status");
const incomingControls = document.getElementById("call-controls-incoming");
const activeControls = document.getElementById("call-controls-active");
const remoteAudio = document.getElementById("remote-audio");

document.getElementById("call-audio-btn").onclick = () => {
  if (!activeUser) return;
  if (!onlineIds.has(activeUser.id)) {
    alert("Собеседник сейчас не в сети — звонок недоступен");
    return;
  }
  startCall(activeUser);
};

async function startCall(user) {
  callPeer = user;
  showCallScreen(user, "исходящий вызов...");
  activeControls.style.display = "none";
  incomingControls.style.display = "none";

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    alert("Нужен доступ к микрофону, чтобы звонить");
    endCall();
    return;
  }

  socket.emit("call:invite", { to: user.id, kind: "audio" });

  createPeerConnection(user.id);
  localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit("call:offer", { to: user.id, offer });
}

function createPeerConnection(remoteId) {
  pc = new RTCPeerConnection(STUN_SERVERS);
  pc.onicecandidate = (e) => {
    if (e.candidate) socket.emit("call:ice-candidate", { to: remoteId, candidate: e.candidate });
  };
  pc.ontrack = (e) => {
    remoteAudio.srcObject = e.streams[0];
  };
  pc.onconnectionstatechange = () => {
    if (pc && (pc.connectionState === "connected")) {
      callStatus.textContent = "на связи";
      activeControls.style.display = "flex";
      incomingControls.style.display = "none";
    }
    if (pc && (pc.connectionState === "disconnected" || pc.connectionState === "failed")) {
      endCall();
    }
  };
}

function showCallScreen(user, statusText) {
  callAvatar.style.background = colorFor(user.id);
  callAvatar.textContent = initials(user.username);
  callName.textContent = user.username;
  callStatus.textContent = statusText;
  callScreen.classList.add("active");
}

function hideCallScreen() {
  callScreen.classList.remove("active");
}

// Входящий звонок
socket.on && null; // (перерегистрируем ниже, после того как socket создан в startApp)

function attachCallSocketHandlers() {
  socket.on("call:invite", ({ from, fromUsername, kind }) => {
    if (callPeer) {
      // уже говорим по телефону — автоотбой второго входящего
      socket.emit("call:reject", { to: from });
      return;
    }
    callPeer = { id: from, username: fromUsername };
    showCallScreen(callPeer, "входящий вызов...");
    incomingControls.style.display = "flex";
    activeControls.style.display = "none";
  });

  socket.on("call:offer", async ({ from, offer }) => {
    if (!pc) createPeerConnection(from);
    await pc.setRemoteDescription(new RTCSessionDescription(offer));
    for (const c of pendingCandidates) await pc.addIceCandidate(c);
    pendingCandidates = [];
  });

  document.getElementById("call-accept-btn").onclick = async () => {
    if (!callPeer) return;
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      alert("Нужен доступ к микрофону, чтобы ответить");
      declineCall();
      return;
    }
    localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit("call:answer", { to: callPeer.id, answer });
    incomingControls.style.display = "none";
    callStatus.textContent = "соединение...";
  };

  document.getElementById("call-reject-btn").onclick = () => {
    if (callPeer) socket.emit("call:reject", { to: callPeer.id });
    declineCall();
  };

  socket.on("call:answer", async ({ answer }) => {
    await pc.setRemoteDescription(new RTCSessionDescription(answer));
    callStatus.textContent = "соединение...";
  });

  socket.on("call:ice-candidate", async ({ candidate }) => {
    try {
      if (pc && pc.remoteDescription) await pc.addIceCandidate(candidate);
      else pendingCandidates.push(candidate);
    } catch (e) {}
  });

  socket.on("call:reject", () => {
    callStatus.textContent = "вызов отклонён";
    setTimeout(endCall, 1200);
  });

  socket.on("call:end", () => {
    if (callPeer) {
      callStatus.textContent = "звонок завершён";
      setTimeout(endCall, 900);
    }
  });

  socket.on("call:unavailable", () => {
    callStatus.textContent = "собеседник не в сети";
    setTimeout(endCall, 1200);
  });
}

function declineCall() {
  hideCallScreen();
  callPeer = null;
  incomingControls.style.display = "none";
}

document.getElementById("call-end-btn").onclick = () => {
  if (callPeer) socket.emit("call:end", { to: callPeer.id });
  endCall();
};

document.getElementById("call-mute-btn").onclick = () => {
  if (!localStream) return;
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach((t) => (t.enabled = !isMuted));
  document.getElementById("call-mute-btn").classList.toggle("on", isMuted);
  document.getElementById("call-mute-btn").textContent = isMuted ? "🔇" : "🎙️";
};

function endCall() {
  hideCallScreen();
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
  remoteAudio.srcObject = null;
  callPeer = null;
  isMuted = false;
  pendingCandidates = [];
  incomingControls.style.display = "none";
  activeControls.style.display = "none";
}

// Регистрируем service worker (для установки как приложение)
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
}
</script>
</body>
</html>
